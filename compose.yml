# Dev-only stack. Production targets Windows Server 2016 + nssm — never deploy
# this file's services to prod. See CLAUDE.md rule 5.
#
# Usage:
#   docker compose up -d --wait api        # start, block until healthy
#   docker compose down                    # stop
#
# Environment is read from .env (auto-loaded by compose).
#
# Per ADR-0008 the API now uses Firebird as the single source of truth — the
# msp-postgres service has been removed. The dev Firebird container
# (`mueblera-firebird`) is started outside compose and joined via the
# external `firebird_default` network.

name: msp-api

services:
  # API en Docker (dev only). El único motivo es que el FbEventListener
  # pueda alcanzar el puerto auxiliar de Firebird sin pasar por la NAT del
  # host de macOS — el driver firebirdsql respeta la IP que Firebird
  # reporta (`172.19.0.2`, IP interna del contenedor) y solo otra
  # entidad dentro de `firebird_default` puede rutear hacia ahí. Prod
  # sigue corriendo nativo en Windows Server 2016 — este target no
  # aplica fuera de dev local Mac/Linux.
  #
  # Usar: `docker compose up -d api && docker compose logs -f api`.
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: msp-api-dev
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    environment:
      # Firebird por nombre del contenedor (resoluble dentro de
      # firebird_default).
      FB_HOST: mueblera-firebird
      FB_PORT: "3050"
      # Air dentro del contenedor; el host ya no corre `make dev`.
      TMPDIR: /tmp
      # El .env apunta a la ruta del host. Adentro del contenedor el repo
      # está bind-mounted en /app, así que reescribimos a esa ruta.
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/serviceAccountKey.json
      # Meilisearch por nombre de servicio (resoluble en msp-api_default).
      # El .env usa localhost:7700 para corridas nativas; aquí lo sobreescribimos
      # porque dentro del contenedor localhost es el propio contenedor.
      MEILISEARCH_URL: http://meilisearch:7700
      # LLM: Ollama corre NATIVO en el host (Metal); dentro del contenedor
      # localhost es el propio contenedor, así que apuntamos al host. Docker
      # Desktop rutea host.docker.internal aunque Ollama escuche en 127.0.0.1.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    volumes:
      # Bind mount del repo entero para hot reload via air. Los caches
      # de Go viven en volumes nombrados para que no se descarte cada
      # `down`/`up`.
      - ./:/app
      - api-go-cache:/go/pkg/mod
      - api-build-cache:/root/.cache/go-build
    ports:
      - "${APP_PORT:-3001}:3001"
    networks:
      - firebird_default
      - default
    # Resolver host.docker.internal en Linux (no-op en Mac/Win).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Firebird de desarrollo (dev only). Producción corre Firebird nativo en
  # Windows Server 2016 — este servicio no aplica ahí (CLAUDE.md regla 5).
  #
  # Está detrás de un profile a propósito: NO arranca con `docker compose up`.
  # Quien ya tiene un contenedor `mueblera-firebird` levantado a mano (la
  # máquina original de desarrollo) no debe tocarlo — este servicio existe
  # para que una máquina nueva pueda reproducirlo sin adivinar.
  #
  # Máquina nueva, una sola vez:
  #   docker network create firebird_default
  #   docker compose --profile firebird up -d firebird
  #   # …y restaurar el respaldo: ver docs/base-de-datos-de-pruebas.md
  #
  # La imagen está FIJADA a v4.0 por una razón concreta: las imágenes de
  # Firebird 5 traen `WireCrypt = Required` y el driver firebirdsql v0.9.19
  # no negocia ese nivel — falla con "Incompatible wire encryption levels
  # requested on client and server" antes de abrir la conexión, y ni un solo
  # test llega a tocar la base. No subir esta versión sin probar el driver.
  #
  # ⚠ El entrypoint escribe /firebird/etc/firebird.conf SOLO en el primer
  # arranque, cuando el volumen está vacío. Si la configuración quedó mal,
  # cambiar variables de entorno NO la corrige: hay que borrar el volumen
  # (`docker volume rm msp-firebird-data`) o editar el archivo a mano.
  firebird:
    profiles: ["firebird"]
    image: jacobalberty/firebird:v4.0
    container_name: mueblera-firebird
    restart: unless-stopped
    environment:
      # `masterkey` es la contraseña por defecto de Firebird y ya está en
      # .env.example y en los comandos de restore de la documentación: no es
      # un secreto, es un valor conocido de desarrollo. Precisamente por eso
      # los puertos se publican solo en loopback (abajo). Este servicio no
      # debe levantarse nunca en un host alcanzable desde la red.
      ISC_PASSWORD: ${FB_PASSWORD:-masterkey}
      FIREBIRD_USER: ${FB_USER:-SYSDBA}
      DBPATH: /firebird/data
    ports:
      # Solo loopback, por la misma razón que el servicio ollama de más
      # abajo: esto es SYSDBA con una contraseña que cualquiera adivina.
      # Publicarlo en 0.0.0.0 lo dejaría accesible desde toda la red local
      # —la del café, la de la oficina— con acceso total a los datos.
      # El contenedor `api` NO pasa por estos puertos: alcanza a Firebird por
      # nombre dentro de firebird_default, así que restringirlos no le afecta.
      # 3050 = SQL. 3051 = puerto de eventos, lo necesita FbEventListener.
      - "127.0.0.1:${FB_PORT:-3050}:3050"
      - "127.0.0.1:3051:3051"
    volumes:
      # Un solo volumen para /firebird: adentro viven data/, etc/, system/
      # y log/. Montar solo data/ haría que la base de seguridad (usuarios y
      # contraseñas) se perdiera en cada recreación del contenedor.
      - firebird-data:/firebird
    networks:
      - firebird_default
    healthcheck:
      # Solo comprueba que el puerto SQL acepte conexiones. A propósito no
      # consulta una base: recién creado el volumen todavía no hay ninguna
      # restaurada, y un healthcheck que exija la base dejaría el servicio
      # en unhealthy para siempre hasta el restore.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3050 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Meilisearch (dev only). In production, run meilisearch.exe via nssm on
  # Windows Server 2016. Expose on the same network so the api container can
  # resolve it by service name.
  #
  # Production note: download meilisearch.exe from
  # https://github.com/meilisearch/meilisearch/releases, install via nssm
  # with MEILI_ENV=production and MEILI_MASTER_KEY set. Data persists in a
  # directory configured via --db-path. No Docker required.
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: msp-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      # Set MEILI_MASTER_KEY to require an API key in development.
      # Leave empty to run without auth (fine for local dev).
      MEILI_MASTER_KEY: ""
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - default

  # Ollama (dev only). Sirve modelos LLM locales para el motor de inteligencia.
  # En producción (Windows Server 2016) se instala ollama.exe vía nssm o se
  # usa llama-server; no requiere Docker. Ver CLAUDE.md rule 5.
  #
  # ⚠ macOS: NO uses este servicio Docker para desarrollar — Docker Desktop NO
  # accede al GPU Metal, así que Ollama corre en CPU dentro de la VM y un modelo
  # de 7B tarda ~minutos por respuesta (inusable). En Mac instala Ollama nativo
  # (`brew install ollama` + `brew services start ollama`), que sí usa Metal.
  # Este servicio compose queda para hosts Linux / CI.
  #
  # Para usar (Linux/CI): `docker compose up -d ollama` y luego
  # `docker exec msp-ollama ollama pull qwen2.5:7b-instruct`.
  # Usa un modelo INSTRUCT (no de razonamiento): qwen3 emite miles de tokens de
  # "pensamiento" por petición y es ~25x más lento.
  # El API arranca con LLM_ENABLED=false — cambiar solo en la fase habilitada.
  # La API corre en el host → LLM_BASE_URL=http://localhost:11434/v1.
  # Si la API corre dentro de compose → LLM_BASE_URL=http://ollama:11434/v1.
  ollama:
    image: ollama/ollama
    container_name: msp-ollama
    restart: unless-stopped
    ports:
      # Bind to loopback only: Ollama has NO auth. Host reaches it at
      # localhost:11434; in-compose callers use the `ollama:11434` DNS name.
      - "127.0.0.1:11434:11434"
    volumes:
      - msp-ollama-data:/root/.ollama
    networks:
      - default

volumes:
  # Nombre distinto a propósito del volumen `firebird_firebird_data` que usa
  # el contenedor levantado a mano en la máquina original: así el servicio de
  # compose nunca escribe sobre esos datos por accidente.
  firebird-data:
    name: msp-firebird-data
  api-go-cache:
    name: msp-api-go-cache
  api-build-cache:
    name: msp-api-build-cache
  meilisearch-data:
    name: msp-meilisearch-data
  msp-ollama-data:
    name: msp-ollama-data

# firebird_default es una red creada externamente cuando el contenedor
# mueblera-firebird se levantó manualmente. Compose la referencia como
# external para no intentar (re)crearla.
networks:
  firebird_default:
    external: true
